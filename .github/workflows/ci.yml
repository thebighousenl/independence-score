name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      # internal/ownershipmap has a test that loads and validates the
      # repo-root ownership-map.yaml (required fields, no duplicate
      # domains, valid bucket), so a pull request that breaks the schema
      # fails here.
      - name: Test
        run: go test ./... -count=1

      # Named separately from the Test step above (which already runs
      # these) so the query-type conformance suite - A/AAAA/CNAME/TXT/
      # SRV/PTR/HTTPS byte-equivalence, EDNS(0)/DNSSEC, TCP fallback,
      # malformed/hostile input, large-answer truncation, every upstream
      # failure mode, and the documented failover behaviour - shows up as
      # its own named, merge-gating check rather than being buried inside
      # a generic "Test" line. A fake/local upstream only: this must
      # never depend on reaching a real resolver like 1.1.1.1, or a
      # flaky network would look like a conformance failure.
      - name: Conformance suite (forwarder, failure modes, failover)
        run: go test ./internal/forwarder/... -v -count=1

      # -race needs cgo, which needs a C compiler; neither engineering
      # sandbox that built M1 had one, so this is the only place it has
      # ever run. ubuntu-latest ships gcc.
      - name: Test (race detector)
        run: go test -race ./... -count=1

  # Neither engineering sandbox that built M1 had a container runtime, so
  # `docker build`/`docker run` were never actually exercised. This job
  # proves the image builds and that a container built from it resolves
  # real queries over both UDP and TCP and serves the dashboard - the
  # same three things a new user's first run depends on.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t independence-score:ci .

      - name: Install dig
        run: sudo apt-get update && sudo apt-get install -y dnsutils

      - name: Run container
        run: |
          docker run -d --name independence-score-ci \
            -p 15353:53/udp -p 15353:53/tcp -p 18080:8080 \
            -e UPSTREAM_DNS=1.1.1.1:53 \
            independence-score:ci

      - name: Wait for dashboard to come up
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:18080/ >/dev/null 2>&1; then
              echo "dashboard is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "dashboard never came up"
          docker logs independence-score-ci
          exit 1

      - name: Resolve a real name over UDP
        run: |
          dig @127.0.0.1 -p 15353 example.com +time=5 +tries=3 | tee /tmp/udp.out
          grep -q "ANSWER SECTION" /tmp/udp.out

      - name: Resolve a real name over TCP
        run: |
          dig +tcp @127.0.0.1 -p 15353 example.com +time=5 +tries=3 | tee /tmp/tcp.out
          grep -q "ANSWER SECTION" /tmp/tcp.out

      - name: Fetch the dashboard
        run: curl -fs http://127.0.0.1:18080/ | grep -q "Independence Score"

      - name: Container logs
        if: always()
        run: docker logs independence-score-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f independence-score-ci || true
