#
# This notice is deliberately separate from the project's own LICENSE file
# (even though the terms are identical) so it is unambiguous that this data
# file can be reused on its own, apart from the Independence Score codebase.
#
# This file contains no data derived from DuckDuckGo Tracker Radar or
# Disconnect (both CC BY-NC-SA, incompatible with the MIT terms above).
# Every entry below was independently curated and the domain's registration
# was verified before being added.
#
# Schema (one list entry per domain):
#   domain:   the registered domain or a specific pinned subdomain
#   company:  the company name (for bucket: company) or self-hosted
#             project/software name (for bucket: self-hosted)
#   bucket:   "company" or "self-hosted"
#   category: a short free-text tag, e.g. "social", "cloud-infra", "nas"
#
# Matching is suffix-based on whole DNS labels (not a raw string suffix):
# "graph.facebook.com" matches "graph.facebook.com" and nothing else here
# that is not under it; "facebook.com" matches any other subdomain of
# facebook.com, including graph.facebook.com, but the more specific entry
# above wins because it has more matching labels.
#
# A domain missing from this file is "unclassified", never guessed into
# either bucket. This file is grown by pull request: add an entry, open a
# PR, and CI validates the schema and runs the classifier fixtures.

